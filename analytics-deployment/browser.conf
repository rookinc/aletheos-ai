# Browser documents receive the first-party consent adapter. Artifact reads keep their original bytes.
# SCOPE is expanded by deploy.py to the public routes on this host, before PHP rewrites.
Header merge Vary Sec-Fetch-Dest "expr=SCOPE && %{CONTENT_TYPE} =~ m#^text/html(?:;|$)#i"
Header merge Vary Accept "expr=SCOPE && %{CONTENT_TYPE} =~ m#^text/html(?:;|$)#i"
FilterDeclare AletheosBrowser
FilterProvider AletheosBrowser PROVIDER "SCOPE && %{CONTENT_TYPE} =~ m#^text/html(?:;|$)#i && (req('Sec-Fetch-Dest') =~ m#^(?:document|iframe|frame)$# || (req('Sec-Fetch-Dest') == '' && req('Accept') =~ m#text/html#i))"
FilterProtocol AletheosBrowser PROVIDER "change=yes;byteranges=no"
FilterChain +AletheosBrowser
TRANSFORM
